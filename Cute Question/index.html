<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Will You Go Out With Me?</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
          rel="stylesheet">

</head>


<body>

    <main class="container">

        <!-- Cute character -->

        <div class="character-box">

            <img src="cat.png"
                 alt="Cute cat">

        </div>


        <!-- Question -->

        <h1>

            Will you go<br>

            out with me?

        </h1>


        <!-- Buttons -->

        <div class="buttons">

            <button id="yesBtn">
                YES ♥
            </button>

            <button id="noBtn">
                NO
            </button>

        </div>

    </main>


    <!-- Success screen -->

    <div id="success">

        <div class="success-heart">
            ♥
        </div>

        <h2>
            YAY!!! 💖
        </h2>

        <p>
            I knew you'd say yes!
        </p>

    </div>


    <script src="script.js"></script>

</body>

</html>
